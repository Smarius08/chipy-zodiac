(function(){
'use strict';
const D=JSON.parse(document.getElementById('data').textContent);
const SIGNS=D.signs, BY=Object.fromEntries(SIGNS.map(s=>[s.name,s]));
const LV={Q:'Quiet',M:'Mixed',S:'Strong',T:'Strongest'}, LVKEY={Quiet:'Q',Mixed:'M',Strong:'S',Strongest:'T'};
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MS=MONTHS.map(m=>m.slice(0,3));
const WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MIN_AGE=18, MIN_YEAR=1900;
const DEFAULT_SIGN=D.defaultSign;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
const isLeap=y=>y%4===0&&(y%100!==0||y%400===0);
const dim=(y,m)=>[31,isLeap(y)?29:28,31,30,31,30,31,31,30,31,30,31][m-1];

const S={sign:DEFAULT_SIGN, override:null, scenario:'auto', fail:false, labels:true, lastKey:null, mi:null, last:null};
function now(){ if(S.override){const [y,m,d]=S.override.split('-').map(Number);return new Date(y,m-1,d,12);} return new Date(); }
function today(){const n=now();return {y:n.getFullYear(),m:n.getMonth()+1,d:n.getDate()};}
const tkey=()=>{const t=today();return iso(t.y,t.m,t.d);};
const cmp=(a,b)=>a<b?-1:a>b?1:0;

/* ---------- sign helpers ---------- */
function inSign(sign,m,d){const s=sign.start,e=sign.end,v=m*100+d,a=s[0]*100+s[1],b=e[0]*100+e[1];return a<=b?(v>=a&&v<=b):(v>=a||v<=b);}
function signOf(m,d){return SIGNS.find(s=>inSign(s,m,d));}
const rangeTxt=s=>`${MS[s.start[0]-1]} ${s.start[1]} – ${MS[s.end[0]-1]} ${s.end[1]}`;
const url=s=>`/tools/${s.slug}-lucky-days-to-gamble`;

function ageCutoff(){const t=today();let y=t.y-MIN_AGE,m=t.m,d=t.d;if(m===2&&d===29&&!isLeap(y))d=28;return iso(y,m,d);}
function levels(year,sign){const L=D.levels[year];return L&&L[sign]?L[sign]:null;}
const doy=(y,m,d)=>{let n=d;for(let i=1;i<m;i++)n+=dim(y,i);return n-1;};
function levelAt(year,sign,m,d){const s=levels(year,sign);return s?LV[s[doy(year,m,d)]]:null;}

function heroHtml(s){const t=today();
 return `<section class="hero" id="tool" aria-label="${esc(s.name)} lucky gambling day tool" style="--base:${s.theme.base};--primary:${s.theme.primary};--secondary:${s.theme.secondary};--cta-text:${s.ctaText}">

 <h1>${esc(fillYear(s.h1,t.y))}</h1>

 <span class="art-ph">ARTWORK PLACEHOLDER · banner not imported (Figma ${esc(s.nodes.desktop)} / 768: ${esc(s.nodes.t768)} / 600: ${esc(s.nodes.t600)} / 360: ${esc(s.nodes.m360)}) · Brief: ${esc(s.art)}</span>
 ${stripHtml(s)}
 <p class="disc">For entertainment purposes only. Your luck score does not predict gambling outcomes or change the mathematical odds of any game.</p>
 <div style="text-align:center"><span class="rv" id="mockflag" hidden></span></div>

  body=`<div class="dp-man"><label for="dp-text">Date</label><input id="dp-text" type="text" inputmode="numeric" maxlength="10" placeholder="dd/mm/yyyy" value="${esc(P.text)}" autocomplete="off" ${P.err?'aria-invalid="true" aria-describedby="dp-err"':''}><p class="hint">dd/mm/yyyy</p><div id="dp-err">${errHtml()}</div></div>`;
 }
 el.innerHTML=head+body+`<div class="dp-f"><button type="button" data-dp="clear">Clear</button><div class="r"><button type="button" data-dp="cancel">Cancel</button><button type="button" data-dp="ok" id="dp-ok">OK</button></div></div>`;
 const f=focusKey==='text'?el.querySelector('#dp-text'):focusKey==='ok'?el.querySelector('[data-dp=day].sel')||el.querySelector('[data-dp=day]:not([disabled])')||el.querySelector('#dp-text')||el.querySelector('#dp-ok'):el.querySelector(`[data-dp="${focusKey}"]:not([disabled])`)||el.querySelector('#dp-ok');
 if(f)f.focus();}
function headline(k){const [y,m,d]=k.split('-').map(Number);return `${WD[new Date(y,m-1,d).getDay()].slice(0,3)}, ${MS[m-1]} ${d}`;}
function errHtml(){if(!P.err)return'';if(P.err.type==='sign'){const o=P.err.sign;return `<p class="dp-err" role="alert">This date falls under ${o.name}. Go to the <a href="${url(o)}" data-gosign="${o.name}">${o.name} tool</a>.</p>`;}return `<p class="dp-err" role="alert">${esc(P.err.msg)}</p>`;}
function parseManual(txt){const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(txt.trim());if(!m)return null;const d=+m[1],mo=+m[2],y=+m[3];if(mo<1||mo>12||y<MIN_YEAR||d<1||d>dim(y,mo))return null;return {y,m:mo,d};}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-dp]');if(!b||!dp().contains(b))return;const s=BY[S.sign],a=b.dataset.dp;
 if(a==='day'){P.sel=b.dataset.d;renderPicker('day');}
 else if(a==='prev'){P.mi=0;renderPicker('next');}
 else if(a==='next'){P.mi=1;renderPicker('prev');}
 else if(a==='years'){P.years=true;renderPicker('year');}
 else if(a==='year'){P.A=+b.dataset.a;P.years=false;renderPicker('years');}
 else if(a==='mode'){if(P.mode==='cal'){P.text=P.sel?fmtDob(P.sel):P.text;P.mode='input';P.err=null;renderPicker('text');}else{const pm=parseManual(P.text);if(pm&&allowed(s,pm.y,pm.m,pm.d)){P.sel=iso(pm.y,pm.m,pm.d);P.A=anchorOf(s,pm.y,pm.m);P.mi=signMonths(s).indexOf(pm.m);}P.mode='cal';P.err=null;P.years=false;renderPicker('mode');}}
 else if(a==='clear'){P.sel='';P.text='';P.err=null;renderPicker(P.mode==='input'?'text':'day');}
 else if(a==='cancel'){dp().close('cancel');}
 else if(a==='ok'){applyOk();}
});
document.addEventListener('input',ev=>{if(ev.target.id==='dp-text'){P.text=ev.target.value;}});
document.addEventListener('keydown',ev=>{if(ev.target.id==='dp-text'&&ev.key==='Enter'){ev.preventDefault();applyOk();}});
function applyOk(){const s=BY[S.sign];
 if(P.mode==='cal'){T.dob=P.sel;syncDob();dp().close('ok');return;}
 const txt=document.getElementById('dp-text').value;P.text=txt;
 if(!txt.trim()){T.dob='';syncDob();dp().close('ok');return;}
 const pm=parseManual(txt),bad=()=>{P.err={type:'msg',msg:'Please enter a valid date'};P.sel='';renderPicker('text');};
 if(!pm)return bad();
 const k=iso(pm.y,pm.m,pm.d);
 if(k>tkey())return bad();           /* future */
 if(k>ageCutoff())return bad();      /* under minimum age */
 if(!inSign(s,pm.m,pm.d)){P.err={type:'sign',sign:signOf(pm.m,pm.d)};renderPicker('text');return;}
 P.sel=k;T.dob=k;syncDob();dp().close('ok');}
function syncDob(){const dEl=document.getElementById('dob');if(!dEl)return;dEl.value=fmtDob(T.dob);const w=dEl.closest('.f-row');if(T.dob){delete T.errors.dob;w.querySelector('.inp').classList.remove('bad');dEl.removeAttribute('aria-invalid');const e=w.querySelector('.ferr');if(e)e.remove();const ic=w.querySelector('.erric');if(ic)ic.remove();}}
dp().addEventListener('close',()=>{syncDob();const tr=document.getElementById('dob-btn');if(tr&&dp().returnValue!=='switch')tr.focus();dp().returnValue='';});

/* ---------- review panel (outside product) ---------- */
function renderReview(force){const r=document.getElementById('review');if(!force&&r.dataset.ready)return;r.dataset.ready='1';const open=r.querySelector('details')&&r.querySelector('details').open;
 r.innerHTML=`<details${open?' open':''}><summary>Review controls (mock, not product)</summary><div class="body">
 <label>Sign preview<select id="rv-sign">${SIGNS.map(x=>`<option${x.name===S.sign?' selected':''}>${x.name}</option>`).join('')}</select></label>
 <label>Local-date override (fixtures: ${D.years.join(', ')})<input type="date" id="rv-date" value="${S.override||''}"></label><button type="button" id="rv-date-clear">Use real local date</button>
 <label>Personal result scenario (mock)<select id="rv-scen">${['auto','low','some','good','jackpot'].map(x=>`<option value="${x}"${S.scenario===x?' selected':''}>${x==='auto'?'Auto: fixture if exists, else Good (mock)':x}</option>`).join('')}</select></label>
 <label><span><input type="checkbox" id="rv-fail"${S.fail?' checked':''}> Simulate request failure</span></label>
 <label><span><input type="checkbox" id="rv-lab"${S.labels?' checked':''}> Show review/placeholder labels</span></label>
 <div class="st" id="rv-status"></div>
 <div class="st"><b>Fixture note:</b> the only documented personal fixture is Capricorn · Marius · 08/01/1986 with date override 2025-01-24 (Good Luck, 5.07/10). Sign-level fixtures exist for ${D.years.join(', ')}; other years show a notice. All other personal results are labelled mock scenarios.</div>
 <div class="st"><b>Unresolved (TBD – Figma):</b> Cancer light palette; Leo/Sagittarius/Aquarius/Pisces Quiet; mobile month view look; date-detail look; tablet 768/600 lower sections; picker visuals; category/sign contrast. See output/review-notes.md.</div></div></details>`;
 renderReviewStatus();}
function renderReviewStatus(){const e=document.getElementById('rv-status');if(!e)return;e.innerHTML=S.last?`Last result source: <b>${S.last.source==='fixture'?'verified fixture':'MOCK scenario (not calculated)'}</b> · ${esc(S.last.category)} · ${S.last.score.toFixed(2)}/10`:'No personal result yet.';}
document.addEventListener('change',ev=>{const id=ev.target.id;
 if(id==='rv-sign')setSign(ev.target.value);
 else if(id==='rv-date'){S.override=ev.target.value||null;S.mi=null;renderAll();}
 else if(id==='rv-scen')S.scenario=ev.target.value;
 else if(id==='rv-fail')S.fail=ev.target.checked;
 else if(id==='rv-lab'){S.labels=ev.target.checked;document.body.classList.toggle('nolabels',!S.labels);}});
document.addEventListener('click',ev=>{if(ev.target.id==='rv-date-clear'){S.override=null;S.mi=null;renderAll();renderReview(true);}});

/* ---------- boot ---------- */
const params=new URLSearchParams(location.search);
if(window.__BUILD_FIXED__){S.override=window.__BUILD_FIXED__;}
renderAll();renderReview(true);setRoving();
document.addEventListener('focusin',()=>{});
window.__mock={setSign,get state(){return {sign:S.sign,tool:T.state};}};
})();
</script>
</body>
</html>
